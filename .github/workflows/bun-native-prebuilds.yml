name: Build Bun tree-sitter prebuilds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.prebuildTarget }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            prebuildTarget: darwin-arm64
            bunTarget: bun-darwin-arm64
          - runner: macos-15-intel
            prebuildTarget: darwin-x64
            bunTarget: bun-darwin-x64
          - runner: ubuntu-24.04-arm
            prebuildTarget: linux-arm64
            bunTarget: bun-linux-arm64
          - runner: ubuntu-24.04
            prebuildTarget: linux-x64
            bunTarget: bun-linux-x64
          - runner: windows-11-arm
            prebuildTarget: win32-arm64
            bunTarget: bun-windows-arm64
          - runner: windows-latest
            prebuildTarget: win32-x64
            bunTarget: bun-windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Upgrade npm on Windows
        if: runner.os == 'Windows'
        run: npm install -g npm@11.6.3

      - name: Install build dependencies
        run: npm ci --ignore-scripts
        working-directory: ontoindex

      - name: Build and smoke target prebuilds
        shell: bash
        run: >-
          npm exec --yes --package=bun@1.4.5 -- node scripts/build-bun-prebuild.cjs
          --prebuild-root "$RUNNER_TEMP/prebuilds"
        working-directory: ontoindex

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-${{ matrix.prebuildTarget }}
          path: |
            ${{ runner.temp }}/prebuilds/tree-sitter/prebuilds/${{ matrix.prebuildTarget }}/tree-sitter.node
            ${{ runner.temp }}/prebuilds/tree-sitter-php/prebuilds/${{ matrix.prebuildTarget }}/tree-sitter-php.node
          if-no-files-found: error
          retention-days: 7
