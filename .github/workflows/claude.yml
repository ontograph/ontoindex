name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Concurrency convention: see CONTRIBUTING.md → "GitHub Actions — Concurrency Convention".
# Serialize per-PR/issue to avoid racing comments.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.event.issue.id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' ||
         github.event.review.author_association == 'MEMBER' ||
         github.event.review.author_association == 'COLLABORATOR')
      ) ||
      (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # required for Claude to read CI results on PRs
    steps:
      # SECURITY: this job holds secrets and write tokens, and claude-code-action loads
      # project settings (.claude/settings.json hooks, .mcp.json, CLAUDE.md) from the
      # workspace. Checking out a fork's head would let an outside PR author influence a
      # privileged run, and the action's PR branch handling only fetches from the base
      # repository's origin, so fork heads are not reliably supported anyway. Fork PRs
      # are therefore skipped: both the checkout and the action below are gated on
      # `same_repo`, which fails closed (a missing or deleted head repository counts as
      # a fork). Use the hardened claude-code-review workflow to review fork PRs.
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            // Determine if this event is PR-related
            let prNumber = null;
            if (context.eventName === 'issue_comment' && context.payload.issue.pull_request) {
              prNumber = context.payload.issue.number;
            } else if (context.eventName === 'pull_request_review_comment') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'pull_request_review') {
              prNumber = context.payload.pull_request.number;
            }

            if (!prNumber) {
              core.setOutput('is_pr', 'false');
              core.setOutput('same_repo', 'true');
              return;
            }

            const resp = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const pr = resp.data;

            const sameRepo = pr.head.repo != null && pr.head.repo.id === pr.base.repo.id;
            core.setOutput('is_pr', 'true');
            core.setOutput('number', String(prNumber));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('same_repo', sameRepo ? 'true' : 'false');
            if (!sameRepo) {
              core.notice(`Skipping pull request #${prNumber}: its head is not in this repository (fork or deleted fork).`);
            }

      - name: Checkout repository
        if: steps.pr.outputs.same_repo == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.is_pr == 'true' && steps.pr.outputs.sha || '' }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        if: steps.pr.outputs.same_repo == 'true'
        uses: anthropics/claude-code-action@9469d113c6afd29550c402740f22d1a97dd1209b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_non_write_users: '*'
          show_full_output: true

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
