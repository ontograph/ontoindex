name: OntoIndex Check

on:
  pull_request:
    paths:
      - 'ontoindex/src/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd ontoindex-shared && npm ci && npm run build
          cd ../ontoindex && npm ci

      - name: Build
        run: cd ontoindex && npm run build

      - name: Run OntoIndex Check
        id: run_check
        run: |
          cd ontoindex
          # `set +e` is required: job steps run under `bash -e`, so a failing
          # check would abort the step before the exit code is captured.
          set +e
          npx ontoindex check > check_output.txt 2>&1
          exit_code=$?
          set -e
          echo "CHECK_OUTPUT<<EOF" >> $GITHUB_ENV
          cat check_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          if [ $exit_code -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit $exit_code
          else
            echo "status=passed" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.run_check.outputs.status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$STATUS" = "failed" ]; then
            printf '### OntoIndex Check Failed\n\n```\n%s\n```\n' "$CHECK_OUTPUT" > comment.md
            gh pr comment "$PR_NUMBER" --body-file comment.md
          else
            gh pr comment "$PR_NUMBER" --body "### OntoIndex Check Passed"
          fi
