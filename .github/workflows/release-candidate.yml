name: Release Candidate

on:
  # Publish a release-candidate build whenever a merge/commit lands on master.
  # Docs/README-only changes are filtered out so prose updates don't
  # cut a release.
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Cycle policy. 'auto' (default) continues the active rc base on this
          branch if there is one, otherwise bumps patch from latest. Choose
          'patch' / 'minor' / 'major' to explicitly select a new base; the rc
          counter always advances when that base already exists.
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      force:
        description: 'Publish another rc even when HEAD already has a completed rc'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# No workflow-level permissions — scoped per job below.
permissions: {}

# Concurrency convention: see CONTRIBUTING.md → "GitHub Actions — Concurrency Convention".
# Serialize all runs on the same ref (push + workflow_dispatch) to prevent two publishes
# racing on the rc counter. cancel-in-progress: false — the earlier merge publishes first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Skip only after the release has passed post-publish verification ──
  # `rc-pending/<HEAD_SHA>/v<VERSION>` reserves an in-flight release and makes
  # retries resume it. `rc-complete/<HEAD_SHA>/v<VERSION>` is written only after
  # npm, the rc dist-tag, the GitHub prerelease, and its tarball are verified.
  guard:
    name: Check if release candidate should run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide
        id: decide
        shell: bash
        env:
          FORCE: ${{ inputs.force }}
          BUMP_INPUT: ${{ inputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" = "true" ]; then
            echo "Force flag set — running regardless of marker tag."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An explicit base selection on dispatch (bump != auto) also bypasses
          # the dedup guard — the maintainer is deliberately asking for a new
          # rc from the same commit.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
             && [ -n "${BUMP_INPUT:-}" ] \
             && [ "${BUMP_INPUT:-auto}" != "auto" ]; then
            echo "Explicit bump=$BUMP_INPUT — bypassing marker dedup."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMPLETE_PATTERN="refs/tags/rc-complete/${HEAD_SHA}/v*"
          if git for-each-ref --format='%(refname)' "$COMPLETE_PATTERN" | grep -q .; then
            echo "HEAD already has a verified release candidate — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No verified release candidate on HEAD — proceeding or resuming."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Reuse the stable CI workflow ─────────────────────────────────────
  ci:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  # ── Publish the rc build to npm + create GitHub prerelease ───────────
  publish:
    name: Publish release candidate to npm
    needs: [guard, ci]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push rc tag + marker
      id-token: write # npm provenance
    outputs:
      vtag: ${{ steps.version.outputs.vtag }}
      complete_tag: ${{ steps.version.outputs.complete_tag }}
      pending_tag: ${{ steps.version.outputs.pending_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ontoindex/package-lock.json

      - name: Resolve rc version
        id: version
        shell: bash
        working-directory: ontoindex
        env:
          BUMP_INPUT: ${{ inputs.bump }}
          EVENT_NAME: ${{ github.event_name }}
          PKG_NAME: ontoindex
          HEAD_SHA: ${{ needs.guard.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          # 1. Current published `latest` — the floor for any new rc base.
          #    Only E404 ("never published") falls back to package.json; any
          #    other error (network, auth, malformed response) fails fast.
          NPM_STDERR_LATEST="$(mktemp)"
          if CURRENT_LATEST="$(npm view "$PKG_NAME" version 2>"$NPM_STDERR_LATEST")"; then
            :
          else
            if grep -q 'E404' "$NPM_STDERR_LATEST"; then
              CURRENT_LATEST="$(node -p "require('./package.json').version")"
              echo "Package not on registry (E404) — seeding from package.json: $CURRENT_LATEST"
            else
              echo "::error::npm registry unreachable for 'view version':" >&2
              cat "$NPM_STDERR_LATEST" >&2
              rm -f "$NPM_STDERR_LATEST"
              exit 1
            fi
          fi
          rm -f "$NPM_STDERR_LATEST"
          # 2. Full version list. Same E404-only fallback.
          NPM_STDERR_VERSIONS="$(mktemp)"
          if VERSIONS_JSON="$(npm view "$PKG_NAME" versions --json 2>"$NPM_STDERR_VERSIONS")"; then
            :
          else
            if grep -q 'E404' "$NPM_STDERR_VERSIONS"; then
              VERSIONS_JSON='[]'
              echo "No published versions for $PKG_NAME yet (E404)."
            else
              echo "::error::npm registry unreachable for 'view versions':" >&2
              cat "$NPM_STDERR_VERSIONS" >&2
              rm -f "$NPM_STDERR_VERSIONS"
              exit 1
            fi
          fi
          rm -f "$NPM_STDERR_VERSIONS"

          GIT_TAGS="$(git tag --list)"
          LATEST_VERSION="$CURRENT_LATEST" \
          PUBLISHED_VERSIONS_JSON="$VERSIONS_JSON" \
          GIT_TAGS="$GIT_TAGS" \
          BUMP_INPUT="${BUMP_INPUT:-auto}" \
          EVENT_NAME="$EVENT_NAME" \
          HEAD_SHA="$HEAD_SHA" \
            node scripts/resolve-rc-version.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Prepare or resume release commit
        id: release
        shell: bash
        working-directory: ontoindex
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
          VTAG: ${{ steps.version.outputs.vtag }}
          PENDING_TAG: ${{ steps.version.outputs.pending_tag }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$RESUME" = "true" ]; then
            git checkout --detach "refs/tags/$PENDING_TAG^{}"
            RELEASE_SHA="$(git rev-parse HEAD)"
            PKG_VERSION="$(node -p "require('./package.json').version")"
            [ "$PKG_VERSION" = "$RC_VERSION" ] || {
              echo "::error::Pending release tree has package version $PKG_VERSION, expected $RC_VERSION"
              exit 1
            }
          else
            if git rev-parse "refs/tags/$VTAG" >/dev/null 2>&1; then
              echo "::error::Tag $VTAG already exists without a pending marker for this commit."
              exit 1
            fi
            npm version "$RC_VERSION" --no-git-tag-version --allow-same-version
            git add package.json package-lock.json 2>/dev/null || git add package.json
            git commit -m "release: $VTAG" --allow-empty
            RELEASE_SHA="$(git rev-parse HEAD)"
            git tag "$PENDING_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$PENDING_TAG"
          fi

          if git rev-parse "refs/tags/$VTAG" >/dev/null 2>&1; then
            [ "$(git rev-list -n 1 "$VTAG")" = "$RELEASE_SHA" ] || {
              echo "::error::$VTAG points to a different release commit."
              exit 1
            }
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Build ontoindex-shared
        run: npm install && npm run build
        working-directory: ontoindex-shared

      - name: Install ontoindex dependencies
        run: npm ci
        working-directory: ontoindex

      - name: Build ontoindex
        run: npm run build
        working-directory: ontoindex

      - name: Dry-run publish
        run: npm publish --dry-run --tag rc
        working-directory: ontoindex

      - name: Publish to npm if needed
        shell: bash
        working-directory: ontoindex
        env:
          RC_VERSION: ${{ steps.version.outputs.rc_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          NPM_STDERR="$(mktemp)"
          if PUBLISHED="$(npm view "ontoindex@$RC_VERSION" version 2>"$NPM_STDERR")"; then
            rm -f "$NPM_STDERR"
            [ "$PUBLISHED" = "$RC_VERSION" ] || exit 1
            npm dist-tag add "ontoindex@$RC_VERSION" rc
            echo "npm already contains $RC_VERSION; repaired rc dist-tag."
          else
            if grep -qiE 'E404|not found' "$NPM_STDERR"; then
              rm -f "$NPM_STDERR"
              npm publish --provenance --access public --tag rc
            else
              echo "::error::npm registry unreachable for publication reconciliation:" >&2
              cat "$NPM_STDERR" >&2
              rm -f "$NPM_STDERR"
              exit 1
            fi
          fi

      - name: Pack GitHub release asset
        run: npm pack --pack-destination ..
        working-directory: ontoindex

      - name: Publish release tag if needed
        shell: bash
        env:
          VTAG: ${{ steps.version.outputs.vtag }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VTAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$VTAG:refs/tags/$VTAG"
            [ "$(git rev-list -n 1 "$VTAG")" = "$RELEASE_SHA" ] || exit 1
          else
            git tag -a "$VTAG" "$RELEASE_SHA" -m "$VTAG"
            git push origin "refs/tags/$VTAG"
          fi

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        with:
          tag_name: ${{ steps.version.outputs.vtag }}
          name: Release Candidate ${{ steps.version.outputs.vtag }}
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          files: ontoindex-*.tgz
          fail_on_unmatched_files: true
          body: |
            Automated release candidate build from `master`.

            **npm:** `npm install ontoindex@rc`
            **Version:** `${{ steps.version.outputs.rc_version }}`
            **Target base:** `${{ steps.version.outputs.base }}` (rc #${{ steps.version.outputs.rc_n }})
            **Source commit (master):** ${{ needs.guard.outputs.head_sha }}
            **Release commit (versioned tree):** ${{ steps.release.outputs.release_sha }}

            Release candidates are pre-stable builds intended for early testing.
            Stable releases remain on the `latest` dist-tag.

      - name: Verify public release state
        run: node scripts/verify-release-state.mjs
        working-directory: ontoindex
        env:
          NPM_PACKAGE_NAME: ontoindex
          RELEASE_VERSION: ${{ steps.version.outputs.rc_version }}
          NPM_DIST_TAG: rc
          RELEASE_TAG: ${{ steps.version.outputs.vtag }}
          GITHUB_TOKEN: ${{ github.token }}

  # ── Build & push RC Docker images ────────────────────────────────────
  # Calls docker.yml as a reusable workflow so that the build, signing, and
  # attestation logic stays in one place. The publish job exposes `vtag`
  # (e.g. `v1.2.3-rc.1`) as an output so we can pass it as the tag input.
  # RC images are signed with Cosign keyless signing; the OIDC identity
  # will be `docker.yml@refs/heads/master` (the caller's ref) rather than a
  # tag ref — see README.md § Docker for the correct verify command for RCs.
  docker:
    name: Build & Push RC Docker images
    needs: [guard, publish]
    if: needs.guard.outputs.should_run == 'true' && needs.publish.outputs.vtag != ''
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      tag: ${{ needs.publish.outputs.vtag }}

  finalize:
    name: Mark verified release candidate complete
    needs: [guard, publish, docker]
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mark release complete
        shell: bash
        env:
          COMPLETE_TAG: ${{ needs.publish.outputs.complete_tag }}
          PENDING_TAG: ${{ needs.publish.outputs.pending_tag }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          git tag "$COMPLETE_TAG" "$RELEASE_SHA"
          git push --atomic origin "refs/tags/$COMPLETE_TAG" ":refs/tags/$PENDING_TAG"
