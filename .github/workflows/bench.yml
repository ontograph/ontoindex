name: Performance Benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/bench.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'ontoindex/package.json'
      - 'ontoindex/package-lock.json'
      - 'ontoindex/src/**'
      - 'ontoindex/scripts/**'
      - 'ontoindex/test/**'
      - 'ontoindex/tsconfig.json'
      - 'ontoindex/vitest.config.ts'
      - 'ontoindex-shared/package.json'
      - 'ontoindex-shared/package-lock.json'
      - 'ontoindex-shared/src/**'
      - 'ontoindex-shared/tsconfig.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd ontoindex-shared && npm install && npm run build
          cd ../ontoindex && npm install

      - name: Build
        run: cd ontoindex && npm run build

      - name: Run Benchmarks
        run: |
          cd ontoindex
          npx vitest bench test/bench/query.bench.ts --project=lbug-db --outputJson test/bench/current.json

      - name: Benchmark Gate
        run: cd ontoindex && node scripts/bench-gate.mjs
