name: Setup OntoIndex Web
description: Setup Node.js 22, build ontoindex-shared, install web dependencies

runs:
  using: composite
  steps:
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          ontoindex-web/package-lock.json
          ontoindex-shared/package-lock.json

    - name: Upgrade npm on Windows
      if: runner.os == 'Windows'
      run: npm install -g npm@11.6.3
      shell: bash

    - name: Build ontoindex-shared
      run: npm ci && npm run build
      shell: bash
      working-directory: ontoindex-shared

    - name: Install web dependencies
      run: npm ci
      shell: bash
      working-directory: ontoindex-web
